<!DOCTYPE html>
<html lang="en">

<head>
    <title>Macfreak</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="awesome.css">
    <link rel="shortcut icon" type="image/x-icon" href="images/dragonicon.jpeg">

    <script src="https://kit.fontawesome.com/70bd1545c6.js"
        crossorigin="anonymous"></script>
</head>

<body>

    <!-- Navigation -->
<header class="navbar">

    <details class="dropdown">
        <summary>
            <i class="fas fa-bars"></i>
        </summary>

        <nav class="navbar-nav">
            <a href="index.html" class="active">Home</a>
            <a href="content.html">Content</a>
            <a href="contact.html">Contact</a>
        </nav>
    </details>

</header>


    <!-- Main page layout -->
    <main class="page-layout">

        <!-- Left sidebar -->
        <aside class="sidebar">
            <h2>About Macfreak</h2>

            <p>
                Welcome to Macfreak!
            </p>

            <p>
                This website contains information, manga and
                other content.
            </p>

            <p>
                Use the navigation bar above to explore the website.
            </p>
        </aside>


        <!-- Main content -->
        <section class="main-content">

            <!-- Top feature -->
            <section class="top-manga">
                <h1>Top Manga</h1>
            </section>


            <!-- Six clickable cards -->
            <section class="card-grid">

                <a href="content.html" class="content-card">
                    <img src="images/manga1.png" alt="Manga 1">
                    <span>View Manga 1</span>
                </a>

                <a href="content.html" class="content-card">
                    <img src="images/manga2.png" alt="Manga 2">
                    <span>View Manga 2</span>
                </a>

                <a href="content.html" class="content-card">
                    <img src="images/manga3.png" alt="Manga 3">
                    <span>View Manga 3</span>
                </a>

                <a href="content.html" class="content-card">
                    <img src="images/manga4.png" alt="Manga 4">
                    <span>View Manga 4</span>
                </a>

                <a href="content.html" class="content-card">
                    <img src="images/manga5.png" alt="Manga 5">
                    <span>View Manga 5</span>
                </a>

                <a href="content.html" class="content-card">
                    <img src="images/manga6.png" alt="Manga 6">
                    <span>View Manga 6</span>
                </a>

            </section>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>Macfreak &copy; 2026</p>
    </footer>

</body>
</html>
